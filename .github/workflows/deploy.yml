name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Add your test command here if you have tests
      # - name: Run tests
      #   working-directory: ./backend
      #   run: pytest

  deploy:
    name: Deploy to Production
    needs: [build-frontend, test-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Backend (Example via Docker/Railway/Render)
        run: |
          echo "Add your deployment scripts here."
          # Example: docker build -t myapp-backend ./backend
          # Example: docker push myapp-backend:latest

      - name: Deploy Frontend (Example to Vercel/Netlify)
        run: |
          echo "Add your frontend deployment scripts here."
          # Example: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
